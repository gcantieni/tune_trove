<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  :root {
    --btn-fg: rgba(0,0,0,0.85);
    --btn-outline: rgba(0,0,0,0.35);
    --btn-hover: rgba(0,0,0,0.05);
    --btn-active: rgba(0,0,0,0.10);
    --btn-radius: 20px;
    --scaffold-bg: #ffffff;
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--scaffold-bg); }
  body { box-sizing: border-box; padding: 2px 0; }
  #controls {
    box-sizing: border-box;
    width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: center; gap: 6px;
    font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--btn-fg);
  }
  .row {
    display: flex; align-items: center; gap: 12px;
    height: 34px;
    min-height: 0;
  }
  #playBtn {
    box-sizing: border-box;
    height: 100%; flex: 0 0 auto;
    font: inherit;
    border: 1px solid var(--btn-outline);
    border-radius: var(--btn-radius);
    background: transparent;
    cursor: pointer;
    padding: 0 16px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    color: inherit;
    user-select: none;
    -webkit-user-select: none;
    transition: background-color 120ms ease;
  }
  #playBtn:hover:not(:disabled) { background: var(--btn-hover); }
  #playBtn:active:not(:disabled) { background: var(--btn-active); }
  #playBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  #loopLabel {
    display: flex; align-items: center; gap: 6px;
    cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  #loopCb {
    appearance: none; -webkit-appearance: none;
    width: 20px; height: 20px;
    margin: 0;
    border: 2px solid var(--btn-outline);
    border-radius: 3px;
    background: transparent;
    cursor: pointer;
    position: relative;
    transition: background-color 120ms ease, border-color 120ms ease;
  }
  #loopCb:hover { border-color: var(--btn-fg); }
  #loopCb:checked {
    background: var(--btn-fg);
    border-color: var(--btn-fg);
  }
  #loopCb:checked::after {
    content: '';
    position: absolute;
    left: 5px; top: 1px;
    width: 5px; height: 10px;
    border: solid var(--scaffold-bg);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  #tempoSlider {
    flex: 1 1 0; min-width: 0;
    -webkit-appearance: none; appearance: none;
    background: transparent;
    height: 32px;
    cursor: pointer;
    margin: 0;
  }
  #tempoSlider::-webkit-slider-runnable-track {
    height: 4px;
    background: var(--btn-outline);
    border-radius: 2px;
  }
  #tempoSlider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 20px; height: 20px;
    background: var(--btn-fg);
    border-radius: 50%;
    margin-top: -8px;
    cursor: pointer;
  }
  #tempoLabel {
    font-size: 13px;
    min-width: 62px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
    margin-left: auto;
  }
</style>
<script src="abcjs-basic-min.js"></script>
</head>
<body>
<div id="controls">
  <div class="row">
    <button id="playBtn" disabled>▶ Play</button>
    <label id="loopLabel">
      <input type="checkbox" id="loopCb">
      <span>Loop</span>
    </label>
    <span id="tempoLabel">100 BPM</span>
  </div>
  <div class="row">
    <input type="range" id="tempoSlider"
      min="25" max="200" step="5" value="100">
  </div>
</div>
<script>
(function() {
  var audioContext = null;
  var currentBuffer = null;
  var isPlaying = false;
  var isLoading = false;
  var btn = document.getElementById('playBtn');
  var loopCb = document.getElementById('loopCb');
  var tempoSlider = document.getElementById('tempoSlider');
  var tempoLabel = document.getElementById('tempoLabel');
  var currentBpm = parseInt(tempoSlider.value, 10) || 100;
  var tempoRestartTimer = null;
  tempoSlider.addEventListener('input', function() {
    currentBpm = parseInt(tempoSlider.value, 10) || 100;
    tempoLabel.textContent = currentBpm + ' BPM';
    // Live-update playback: debounce a restart so dragging doesn't thrash
    // through dozens of init/prime cycles.
    if ((isPlaying || isLoading) && window.currentAbc) {
      if (tempoRestartTimer) clearTimeout(tempoRestartTimer);
      tempoRestartTimer = setTimeout(function() {
        tempoRestartTimer = null;
        if ((isPlaying || isLoading) && window.currentAbc) {
          doPlay(window.currentAbc);
        }
      }, 250);
    }
  });

  function emit(kind, detail) {
    var msg = JSON.stringify({ kind: kind, detail: detail || null });
    if (window.AbcMidi && window.AbcMidi.postMessage) {
      window.AbcMidi.postMessage(msg);
    }
  }

  function debug(msg) { emit('debug', msg); }

  function refreshButton() {
    if (isLoading) btn.textContent = '⏳ Loading…';
    else if (isPlaying) btn.textContent = '⏹ Stop';
    else btn.textContent = '▶ Play';
    btn.disabled = !window.currentAbc || clickLocked;
  }

  window.setCurrentAbc = function(abc) {
    window.currentAbc = (abc && abc.length) ? abc : null;
    refreshButton();
  };

  window.setTheme = function(vars) {
    var style = document.documentElement.style;
    for (var key in vars) {
      style.setProperty('--' + key, vars[key]);
    }
  };

  window.onerror = function(message, source, line) {
    emit('error', 'js error: ' + message + ' @ ' + (source || '?') + ':' + line);
    return false;
  };
  window.addEventListener('unhandledrejection', function(ev) {
    var r = ev.reason;
    emit('error', 'unhandled rejection: ' +
      (r && r.message ? r.message : String(r)));
  });

  debug('init: AbcMidi=' + !!(window.AbcMidi && window.AbcMidi.postMessage) +
        ' AbcMidiAsset=' + !!(window.AbcMidiAsset && window.AbcMidiAsset.postMessage));

  // -----------------------------------------------------------------
  // XHR shim: WKWebView blocks XHR from file:// origins, so we route
  // abcjs's per-note MP3 fetches through Dart via a JS channel.
  // -----------------------------------------------------------------
  var pendingAssetRequests = {};
  var nextRequestId = 1;

  function b64ToArrayBuffer(b64) {
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes.buffer;
  }

  window.deliverAsset = function(id, b64OrNull) {
    var req = pendingAssetRequests[id];
    if (!req) return;
    delete pendingAssetRequests[id];
    if (b64OrNull == null) { req.fail(); return; }
    try { req.resolve(b64ToArrayBuffer(b64OrNull)); }
    catch (e) { req.fail(); }
  };

  function requestAssetViaDart(url, onArrayBuffer, onFail) {
    var id = nextRequestId++;
    pendingAssetRequests[id] = { resolve: onArrayBuffer, fail: onFail };
    if (window.AbcMidiAsset && window.AbcMidiAsset.postMessage) {
      window.AbcMidiAsset.postMessage(JSON.stringify({ id: id, url: url }));
    } else {
      delete pendingAssetRequests[id];
      onFail();
    }
  }

  var OrigXHR = window.XMLHttpRequest;
  var noteUrlPattern = /soundfonts\/[^\/]+-mp3\/[^\/]+\.mp3$/;

  function FakeXHR() {
    this._intercepted = false;
    this._url = '';
    this._real = null;
    this.readyState = 0;
    this.status = 0;
    this.response = null;
    this.responseType = '';
    this.onload = null;
    this.onerror = null;
  }

  FakeXHR.prototype.open = function(method, url, async) {
    if (noteUrlPattern.test(String(url))) {
      this._intercepted = true;
      this._url = String(url);
      return;
    }
    this._real = new OrigXHR();
    this._real.open(method, url, async !== false);
  };

  FakeXHR.prototype.send = function() {
    var self = this;
    if (self._intercepted) {
      requestAssetViaDart(self._url, function(buf) {
        self.status = 200;
        self.readyState = 4;
        self.response = buf;
        if (self.onload) self.onload({ target: self });
      }, function() {
        self.status = 404;
        self.readyState = 4;
        if (self.onerror) self.onerror({ target: self });
      });
      return;
    }
    if (!self._real) return;
    self._real.responseType = self.responseType;
    self._real.onload = function(e) {
      self.status = self._real.status;
      self.response = self._real.response;
      self.readyState = self._real.readyState;
      if (self.onload) self.onload(e);
    };
    self._real.onerror = function(e) { if (self.onerror) self.onerror(e); };
    self._real.send();
  };

  window.XMLHttpRequest = FakeXHR;

  function ensureAudioContext() {
    if (audioContext) return audioContext;
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) throw new Error('AudioContext not supported');
    audioContext = new Ctor();
    return audioContext;
  }

  function setLoading(v) { isLoading = v; refreshButton(); }
  function setPlaying(v) { isPlaying = v; refreshButton(); }

  // Each call to doPlay/doStop bumps sessionId. In-flight init/prime/start
  // chains and the end-of-tune setTimeout all carry a captured mySession and
  // bail if they've been superseded — otherwise stale end-of-tune timers
  // from prior plays would re-enter the loop branch and stack multiple
  // CreateSynth instances onto the same AudioContext.
  var sessionId = 0;
  var clickLocked = false;

  function doPlay(abc) {
    if (!ABCJS || !ABCJS.synth) { emit('error', 'ABCJS.synth missing'); return; }
    if (!ABCJS.synth.supportsAudio()) {
      emit('error', 'audio not supported'); return;
    }
    var mySession = ++sessionId;
    setLoading(true);
    emit('loading');

    var ctx;
    try { ctx = ensureAudioContext(); }
    catch (e) { setLoading(false); emit('error', e.message); return; }

    if (currentBuffer) { try { currentBuffer.stop(); } catch (e) {} }
    var myBuffer = new ABCJS.synth.CreateSynth();
    currentBuffer = myBuffer;

    function abandon() {
      try { myBuffer.stop(); } catch (e) {}
      if (currentBuffer === myBuffer) currentBuffer = null;
    }

    var resumed = ctx.state === 'suspended' ? ctx.resume() : Promise.resolve();
    resumed.then(function() {
      if (mySession !== sessionId) { abandon(); return; }
      var parsed = ABCJS.renderAbc('*', abc);
      var visualObj = parsed && parsed[0];
      if (!visualObj) {
        abandon();
        setLoading(false); emit('error', 'parse returned no tune'); return;
      }
      return myBuffer.init({
        audioContext: ctx,
        visualObj: visualObj,
        options: {
          soundFontUrl: './soundfonts/',
          qpm: currentBpm,
        },
      }).then(function() {
        if (mySession !== sessionId) { abandon(); return; }
        return myBuffer.prime();
      }).then(function() {
        if (mySession !== sessionId) { abandon(); return; }
        myBuffer.start();
        setLoading(false);
        setPlaying(true);
        emit('playing');
        var totalMs = (myBuffer.duration || 0) * 1000;
        setTimeout(function() {
          if (mySession !== sessionId) return; // superseded — stale tick
          if (!isPlaying) return;
          if (currentBuffer === myBuffer) currentBuffer = null;
          if (loopCb.checked && window.currentAbc) {
            doPlay(window.currentAbc);
          } else {
            setPlaying(false);
            emit('ended');
          }
        }, totalMs + 100);
      });
    }).catch(function(err) {
      if (mySession !== sessionId) return;
      abandon();
      setLoading(false); setPlaying(false);
      emit('error', (err && err.message ? err.message : String(err)));
    });
  }

  function doStop() {
    ++sessionId; // invalidate any in-flight session
    if (currentBuffer) {
      try { currentBuffer.stop(); } catch (e) {}
      currentBuffer = null;
    }
    if (isPlaying || isLoading) {
      setLoading(false); setPlaying(false);
      emit('stopped');
    }
  }

  btn.addEventListener('click', function() {
    if (clickLocked || btn.disabled) return;
    // Brief lock so a rapid second click can't fire before refreshButton
    // repaints the new state. refreshButton honors clickLocked.
    clickLocked = true;
    refreshButton();
    if (isPlaying || isLoading) doStop();
    else if (window.currentAbc) doPlay(window.currentAbc);
    setTimeout(function() {
      clickLocked = false;
      refreshButton();
    }, 250);
  });

  // Keep playAbc/stopAbc exposed for any programmatic Dart-side triggers,
  // but real playback should happen through the in-WebView button click so
  // WebKit registers the user gesture and unlocks AudioContext.
  window.playAbc = function(abc) { doPlay(abc); };
  window.stopAbc = function() { doStop(); };
})();
</script>
</body>
</html>
